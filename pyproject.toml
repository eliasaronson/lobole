# The lobole Python package: the JSON-RPC client, the SDK and the MCP server
# that drive a running Loböle (docs/scripting/README.md). The C++ app is NOT
# in here — it ships via nix/Flatpak; this is the surface that attaches to a
# running instance (or names the command to start one).
#
#   uv tool install /path/to/this/repo          # local clone
#   uvx --from git+<this repository> lobole-mcp  # straight from git
#   claude mcp add lobole -- lobole-mcp
#
# In the repo itself nothing is installed: shell.nix and ctest put python/ on
# PYTHONPATH, so `import lobole` works from every script and test.
[build-system]
requires = ["setuptools>=77"]  # 77: `license` as an SPDX expression (PEP 639)
build-backend = "setuptools.build_meta"

[project]
name = "lobole"
dynamic = ["version"]
description = "Drive a running Loböle CAD instance: JSON-RPC client, SDK and MCP server"
requires-python = ">=3.11"  # typing.Self, NotRequired, Unpack
license = "AGPL-3.0-or-later"
# The 2.x line: lobole/mcp.py is written against mcp 2's MCPServer, which is
# what shell.nix's nixpkgs gives and so what every test here runs, and the
# wheel must ship the SDK the tests ran. 1.x lacks MCPServer; <3 because a
# major moves the API (2.0 renamed FastMCP and removed it), and the move to
# the next one is a migration of lobole/mcp.py, not a loosened pin.
dependencies = ["mcp>=2,<3"]

[project.scripts]
lobole-mcp = "lobole.mcp:main"
lobole-remote = "lobole.client:main"

[tool.setuptools]
package-dir = { "" = "python" }
packages = ["lobole"]

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.package-data]
lobole = ["py.typed"]
