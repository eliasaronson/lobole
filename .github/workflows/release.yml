# A tag builds the release: every download is built, started and made to
# model a part (tools/release-smoke.py) before any of it is published.
#
#   push a tag v<VERSION>   build, smoke, then publish: a GitHub release with
#                           the files and SHA256SUMS, the wheel to PyPI, the
#                           headless image to GHCR
#   workflow_dispatch       the same builds and smokes, publishing nothing —
#                           how this workflow is tested before a tag
#
# docs/packaging/README.md#releasing says what to do before tagging.
#
# Cachix: set the repository variable CACHIX_CACHE (the cache's name) and the
# secret CACHIX_AUTH_TOKEN, and every nix job here pulls from and pushes to
# it. Without them the jobs build OpenCASCADE and Netgen from source, which is
# slow but correct.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read


# Nothing a runner starts is watched: a native message box (a startup
# failure, a lost device; src/app/StartupReport.h) would wait for a click.
env:
  LOBOLE_NO_DIALOG: "1"
  # tools/release-smoke.py writes each app it starts' output here, relative
  # to the job's working directory; a failed smoke uploads it.
  LOBOLE_SMOKE_LOG_DIR: smoke-logs

jobs:
  # A tag that disagrees with what it builds is refused, not shipped.
  check:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        name: Tag, VERSION and metainfo agree
        run: |
          version="$(cat VERSION)"
          tag="${GITHUB_REF_NAME}"
          [ "${{ github.ref_type }}" = "tag" ] || tag="v$version"
          python3 tools/release-notes.py "$tag" > notes.md
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: notes
          path: notes.md

  # The flake's package: the headless AppImage and the container image.
  linux:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          extra_nix_config: "experimental-features = nix-command flakes"
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        if: vars.CACHIX_CACHE != ''
        with:
          name: ${{ vars.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build the package
        run: nix build .#default -L

      # Headless only: the bundle carries its own glibc, which the host's GPU
      # driver cannot share (docs/packaging/README.md#the-headless-appimage).
      - name: Bundle the headless AppImage
        run: |
          nix bundle \
            --bundler github:ralismark/nix-appimage/7946addbc0d97e358a6d7aefe5e82310f0fe6b18 \
            .#default -o appimage
          cp -L appimage "lobole-${{ needs.check.outputs.version }}-x86_64-headless.AppImage"
          chmod +x lobole-*.AppImage

      # The bundle's launcher bind-mounts its own /nix in a user namespace,
      # which Ubuntu 23.10+ restricts through AppArmor; a user on Ubuntu
      # needs the same sysctl (docs/packaging/README.md#the-headless-appimage).
      - name: Smoke the AppImage
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          python3 tools/release-smoke.py --port 8437 \
            --version "${{ needs.check.outputs.version }}" \
            -- "./lobole-${{ needs.check.outputs.version }}-x86_64-headless.AppImage"

      - name: Build the container image
        run: nix build .#dockerHeadless -o image.tar.gz

      - name: Smoke the container image
        run: |
          docker load < image.tar.gz
          docker run -d --rm --name lobole -p 8437:8437 lobole-headless:latest
          python3 tools/release-smoke.py --attach --port 8437
          docker rm -f lobole

      - name: The container's output
        if: failure()
        run: |
          mkdir -p smoke-logs
          docker logs lobole > smoke-logs/container.log 2>&1 || true

      - name: The smoked app's output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-logs-linux
          path: smoke-logs/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            lobole-*.AppImage
            image.tar.gz

  # Cross-built on Linux (docs/packaging/README.md#windows), from the
  # flake's nixpkgs rather than whatever a channel says today.
  windows:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          extra_nix_config: "experimental-features = nix-command flakes"
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        if: vars.CACHIX_CACHE != ''
        with:
          name: ${{ vars.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Pin NIX_PATH to the flake's nixpkgs
        run: |
          nixpkgs="$(nix eval --raw --impure --expr \
            '(builtins.getFlake (toString ./.)).inputs.nixpkgs.outPath')"
          echo "NIX_PATH=nixpkgs=$nixpkgs" >> "$GITHUB_ENV"

      # --cores 4: the cross link runs out of memory at full parallelism.
      - name: Build the zip and the installer
        run: nix-build packaging/windows/installer.nix --cores 4 -o win

      # Nix's Xvfb, Wine and GL find their drivers only at
      # /run/opengl-driver, which NixOS provides and the runner does not:
      # without it Xvfb has no GLX, Wine no Vulkan, and the window test fails
      # with VK_ERROR_INCOMPATIBLE_DRIVER. Mesa there is what NixOS would put.
      - name: Smoke the portable zip under Wine
        run: |
          mesa="$(nix build --no-link --print-out-paths nixpkgs#mesa)"
          sudo ln -sfn "$mesa" /run/opengl-driver
          export LAVAPIPE_ICD="$(ls "$mesa"/share/vulkan/icd.d/lvp_icd.*.json)"
          nix shell nixpkgs#wineWow64Packages.stable nixpkgs#xvfb \
            nixpkgs#python3 nixpkgs#unzip -c \
            packaging/windows/smoke.sh win/lobole-*-portable.zip \
              "${{ needs.check.outputs.version }}"

      - name: The smoked app's output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-logs-windows
          path: smoke-logs/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: win/*

  # The Ubuntu 26.04 package (docs/packaging/README.md#the-debian-package):
  # built against the distribution's own libraries, with the full GUI.
  deb:
    needs: check
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    steps:
      # A bare image has no CA roots, and checkout needs them.
      - name: Container prerequisites
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            --no-install-recommends ca-certificates git
      - uses: actions/checkout@v7
        with:
          submodules: true
      # The stock-ubuntu CI job's list, plus Netgen and Spectra (FEM meshing
      # and modal analysis) and what cpack runs.
      # `netgen` and `python3-netgen` only because Ubuntu's NetgenConfig.cmake
      # checks every target's file (the netgen binary, the Python modules)
      # and stops configure without them; the package links libnglib alone.
      - name: Build dependencies
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            cmake ninja-build build-essential python3 \
            libvulkan-dev glslc libglfw3-dev libglm-dev \
            libspdlog-dev libgtk-3-dev nlohmann-json3-dev libeigen3-dev libboost-dev \
            libocct-data-exchange-dev libocct-modeling-algorithms-dev \
            libocct-modeling-data-dev libocct-foundation-dev libocct-ocaf-dev \
            libocct-visualization-dev libtbb-dev libvterm-dev \
            libnglib-dev netgen python3-netgen libspectra-dev dpkg-dev file ccache
      # A compile cache for the three jobs that build in a distribution's
      # container (deb, appimage, aur): a tag's run finds the dry run's
      # objects for the same commit, and a later release most of them. The
      # save half runs on failure too.
      - name: ccache (restore)
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ccache
          key: ccache-deb-${{ github.sha }}
          restore-keys: ccache-deb-
      - name: Build the package
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr -DLOBOLE_PACKAGE_DEB=ON \
            -DLOBOLE_BUILD_TESTS=OFF
          cmake --build build -j"$(nproc)" --target designer
          (cd build && cpack)
          dpkg-deb --info build/lobole_*.deb
      - name: ccache (save)
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ccache
          key: ccache-deb-${{ github.sha }}
      - uses: actions/upload-artifact@v7
        with:
          name: deb
          path: build/lobole_*.deb

  # Installed the way a user installs it, into an image that has never seen
  # the build: apt resolves Depends, and a missing one fails here.
  deb-smoke:
    needs: [check, deb]
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    steps:
      - name: Container prerequisites
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            --no-install-recommends ca-certificates python3
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: deb
      - name: Install it
        run: DEBIAN_FRONTEND=noninteractive apt-get install -y ./lobole_*.deb
      - name: Smoke it
        run: |
          python3 tools/release-smoke.py --port 8437 \
            --version "${{ needs.check.outputs.version }}" -- /usr/bin/lobole
      - name: The smoked app's output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-logs-deb
          path: smoke-logs/
          if-no-files-found: ignore

  # The GUI AppImage (docs/packaging/README.md#the-gui-appimage): built on
  # Ubuntu 22.04's glibc, the oldest LTS in standard support and the oldest
  # glibc it runs on, with every library but glibc and the graphics stack
  # inside. What 22.04 lacks is built from source and cached on the script
  # that builds it.
  appimage:
    needs: check
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    timeout-minutes: 180
    steps:
      - name: Container prerequisites
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            --no-install-recommends ca-certificates git zstd
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/cache@v6
        with:
          path: /opt/lobole-deps
          key: appimage-deps-${{ hashFiles('packaging/appimage/deps.sh', 'nix/patches/occt-*.patch') }}
      - name: ccache (restore)
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ccache
          key: ccache-appimage-${{ github.sha }}
          restore-keys: ccache-appimage-
      # A fixed work directory, so the generated headers' paths, and with
      # them the compile cache's keys, are the same on every run.
      - name: Build the AppImage
        env:
          LOBOLE_APPIMAGE_WORK: /opt/appimage-work
        run: packaging/appimage/build.sh "${{ needs.check.outputs.version }}" dist
      - name: ccache (save)
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ccache
          key: ccache-appimage-${{ github.sha }}
      # The AppImage, and the source package of the ccx inside it, which a
      # release attaches (docs/packaging/README.md#the-bundled-calculix).
      - uses: actions/upload-artifact@v7
        with:
          name: appimage
          path: |
            dist/*.AppImage
            dist/calculix-ccx-*-source.tar

  # Run where it was not built: the oldest glibc it promises, and two other
  # distributions, each with only what a desktop already has.
  appimage-smoke:
    needs: [check, appimage]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:22.04", "ubuntu:24.04", "debian:13", "fedora:latest"]
        lane: [""]
        # The second lane: a host with neither the Vulkan loader nor a
        # driver (docs/packaging/README.md#the-gui-appimage).
        include:
          - image: "ubuntu:22.04"
            lane: "--no-vulkan"
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: appimage
      - name: Smoke it
        run: |
          chmod +x lobole-*.AppImage
          packaging/appimage/smoke.sh lobole-*-x86_64.AppImage \
            "${{ needs.check.outputs.version }}" ${{ matrix.lane }}
      - name: The smoked app's output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-logs-appimage-${{ strategy.job-index }}
          path: smoke-logs/
          if-no-files-found: ignore

  # The macOS app (docs/packaging/README.md#the-macos-app): Lobole.app with
  # every library it loads inside, MoltenVK and the Vulkan loader too, in a
  # .dmg. Signed with a Developer ID and notarised when the secrets below
  # exist; otherwise ad-hoc signed (Apple Silicon runs nothing unsigned) and
  # the log and the release notes say so.
  #
  #   MACOS_CERTIFICATE_P12       base64 of the Developer ID Application .p12
  #   MACOS_CERTIFICATE_PASSWORD  its password
  #   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD   for notarytool
  #
  # The dependencies and their cache are the CI job's (ci.yml, macos).
  macos:
    needs: check
    runs-on: macos-26
    timeout-minutes: 300
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
      notarised: ${{ steps.notarise.outputs.notarised }}
      minimum: ${{ steps.runner.outputs.minimum }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      LOBOLE_MEM_RESERVE_MB: "512"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: The runner
        id: runner
        run: |
          sw_vers
          xcodebuild -version
          {
            echo "os=$(sw_vers -productVersion | cut -d. -f1)"
            echo "xcode=$(xcodebuild -version | head -1 | tr ' ' '-')"
            echo "minimum=$(. tools/macos-env.sh && echo "$MACOSX_DEPLOYMENT_TARGET")"
          } >> "$GITHUB_OUTPUT"
          echo "CCACHE_DIR=$HOME/.cache/ccache" >> "$GITHUB_ENV"
      - name: Dependencies (cache)
        id: deps
        uses: actions/cache@v6
        with:
          path: ~/.local/share/lobole/macos-deps
          key: macos-deps-${{ steps.runner.outputs.os }}-${{ steps.runner.outputs.xcode }}-${{ hashFiles('packaging/macos/deps.sh', 'packaging/appimage/deps.sh', 'nix/patches/occt-*.patch') }}
      - name: Dependencies
        run: |
          if [ "${{ steps.deps.outputs.cache-hit }}" = true ]; then
            packaging/macos/deps.sh --brew-only
          else
            packaging/macos/deps.sh
          fi
      - name: ccache (restore)
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ccache
          key: ccache-macos-release-${{ github.sha }}
          restore-keys: ccache-macos-release-
      - name: Build and install
        run: |
          . tools/macos-env.sh
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DLOBOLE_BUILD_TESTS=OFF
          cmake --build build -j"$(sysctl -n hw.ncpu)" --target designer
          cmake --install build --prefix "$PWD/stage"
      - name: ccache (save)
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ccache
          key: ccache-macos-release-${{ github.sha }}
      - name: Bundle Lobole.app
        run: |
          . tools/macos-env.sh
          python3 packaging/macos/bundle.py \
            --version "${{ needs.check.outputs.version }}" \
            --stage stage --out dist \
            --search "$LOBOLE_MACOS_DEPS/lib" \
            --search "$LOBOLE_MACOS_DEPS/Contents/MacOS" \
            --search "$LOBOLE_MACOS_DEPS/Contents/Frameworks"
      # A Developer ID from the secrets, in a keychain of this job's own;
      # without them, ad-hoc, said in the log and (via `signed`) the notes.
      - name: Sign
        id: sign
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE_P12" ]; then
            echo "::warning::No Developer ID certificate (MACOS_CERTIFICATE_P12): the app is ad-hoc signed and not notarised. Gatekeeper will ask users to allow it."
            packaging/macos/sign.sh dist/Lobole.app
            echo "signed=adhoc" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          kc_pass="$(uuidgen)"
          security create-keychain -p "$kc_pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kc_pass" "$keychain"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$kc_pass" "$keychain" >/dev/null
          # The user's keychains, word-split on purpose (none has a space).
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" |
            awk '/Developer ID Application/ {print $2; exit}')"
          [ -n "$identity" ] || {
            echo "the certificate holds no Developer ID Application identity:"
            security find-identity -v -p codesigning "$keychain"; exit 1; }
          packaging/macos/sign.sh dist/Lobole.app "$identity"
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          echo "signed=developer-id" >> "$GITHUB_OUTPUT"
      - name: Make the disk image
        run: |
          dmg="lobole-${{ needs.check.outputs.version }}-macos-arm64.dmg"
          mkdir -p dmgroot
          ditto dist/Lobole.app dmgroot/Lobole.app
          ln -s /Applications dmgroot/Applications
          hdiutil create -volname "Loböle ${{ needs.check.outputs.version }}" \
            -srcfolder dmgroot -fs HFS+ -format UDZO -ov "$dmg"
          if [ -n "${{ steps.sign.outputs.identity }}" ]; then
            codesign --force --sign "${{ steps.sign.outputs.identity }}" \
              --timestamp "$dmg"
          fi
          echo "DMG=$dmg" >> "$GITHUB_ENV"
      - name: Notarise
        id: notarise
        if: steps.sign.outputs.signed == 'developer-id'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_TEAM_ID" ] || [ -z "$APPLE_APP_PASSWORD" ]; then
            echo "::warning::Signed with a Developer ID but not notarised (APPLE_ID, APPLE_TEAM_ID or APPLE_APP_PASSWORD missing): Gatekeeper will still ask users to allow it."
            exit 0
          fi
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" \
            --wait --timeout 60m
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          echo "notarised=yes" >> "$GITHUB_OUTPUT"
      - name: Smoke the disk image
        run: packaging/macos/smoke.sh "$DMG" "${{ needs.check.outputs.version }}"
      # continue-on-error: whether this runner's virtual GPU gives MoltenVK a
      # device is unproven; with none the script says so and passes. What
      # removes it: a release run that shows a device and this step green.
      - name: Open a window on the bundled MoltenVK
        continue-on-error: true
        run: packaging/macos/smoke.sh "$DMG" "${{ needs.check.outputs.version }}" --window
      - name: The smoked app's output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-logs-macos
          path: smoke-logs/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: lobole-*-macos-arm64.dmg

  # The complete source, submodules included, for packagers
  # (docs/packaging/README.md#the-source-tarball).
  source:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Make the tarball
        run: tools/source-tarball.sh "${{ needs.check.outputs.version }}" dist
      - uses: actions/upload-artifact@v7
        with:
          name: source
          path: dist/*

  # The AUR package, built from that tarball with makepkg the way an Arch
  # user builds it, installed, and smoked (docs/packaging/README.md#arch-linux-aur).
  aur:
    needs: [check, source]
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Container prerequisites
        run: pacman -Syu --noconfirm --needed base-devel git python ccache
      - uses: actions/checkout@v7
      - name: ccache (restore)
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ccache
          key: ccache-aur-${{ github.sha }}
          restore-keys: ccache-aur-
      - uses: actions/download-artifact@v8
        with:
          name: source
          path: aur
      # makepkg refuses root.
      - name: Build, install and smoke the package
        run: |
          version="${{ needs.check.outputs.version }}"
          cp packaging/aur/PKGBUILD aur/
          sum="$(sha256sum "aur/lobole-$version-src.tar.gz" | cut -d' ' -f1)"
          sed -i "s/^pkgver=.*/pkgver=$version/; s/^sha256sums=.*/sha256sums=('$sum')/" aur/PKGBUILD
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chown -R builder aur
          # The compile cache is root's home's; builder writes it.
          export CCACHE_DIR="$HOME/.cache/ccache"
          mkdir -p "$CCACHE_DIR" && chown -R builder "$CCACHE_DIR"
          (cd aur && sudo --preserve-env=CCACHE_DIR -u builder makepkg -s --noconfirm \
             && sudo -u builder sh -c 'makepkg --printsrcinfo > .SRCINFO')
          pacman -U --noconfirm aur/lobole-*.pkg.tar.zst
          python3 tools/release-smoke.py --port 8437 --version "$version" -- /usr/bin/lobole
      - name: The smoked app's output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-logs-aur
          path: smoke-logs/
          if-no-files-found: ignore
      - name: ccache (save)
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ccache
          key: ccache-aur-${{ github.sha }}
      - uses: actions/upload-artifact@v7
        with:
          name: aur
          include-hidden-files: true  # .SRCINFO
          path: |
            aur/PKGBUILD
            aur/.SRCINFO

  python:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # The oldest Python pyproject.toml accepts: rpc.py once imported only
      # on 3.14, which defers annotations by itself, while promising 3.11.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Build the sdist and the wheel
        run: |
          python -m pip install --upgrade build setuptools
          python -m build
      - name: Smoke the wheel
        run: python tests/packaging_smoke.py
      - uses: actions/upload-artifact@v7
        with:
          name: python
          path: dist/*

  # Everything below publishes, and runs only for a tag whose every build and
  # smoke above passed.
  github-release:
    if: github.ref_type == 'tag'
    needs: [check, linux, appimage-smoke, windows, deb-smoke, macos, source, aur, python]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir files
          # appimage/ holds the Ubuntu source package of the ccx the AppImage
          # carries: the GPL source of the one ccx a release ships as a file
          # (the Flatpak builds its own from the source its manifest pins).
          cp linux/*.AppImage appimage/*.AppImage appimage/calculix-ccx-*-source.tar \
            windows/* deb/*.deb macos/*.dmg source/* python/* files/
          (cd files && sha256sum -- * > SHA256SUMS)
          {
            cat notes/notes.md
            echo
            echo "**Windows:** smoked under Wine for every release and tested"
            echo "on Windows by hand; the installer is not signed, so"
            echo "SmartScreen will warn. **AppImage:** \`x86_64.AppImage\` is"
            echo "the full GUI for any distribution with glibc 2.39 or newer"
            echo "(Ubuntu 24.04, Debian 13, Fedora 40 and later);"
            echo "\`headless.AppImage\` is the document engine and its"
            echo "JSON-RPC interface without a window, for servers."
            echo "**.deb:** Ubuntu 26.04 only, the full GUI; install it with"
            echo "\`sudo apt install ./lobole_*_amd64.deb\`."
            echo "**macOS:** \`macos-arm64.dmg\`, Apple Silicon, macOS"
            echo "${{ needs.macos.outputs.minimum }} or newer; drag Loböle to Applications."
            if [ "${{ needs.macos.outputs.notarised }}" != yes ]; then
              echo "It is not notarised by Apple, so macOS refuses the first launch:"
              echo "open System Settings → Privacy & Security and choose **Open Anyway**."
            fi
          } > body.md
          gh release create "$GITHUB_REF_NAME" files/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Loböle ${{ needs.check.outputs.version }}" \
            --notes-file body.md

  # Trusted publishing: PyPI trusts this workflow by name, so no token is
  # stored. Configure it once on pypi.org (project lobole, workflow
  # release.yml, environment pypi) before the first tag.
  pypi:
    if: github.ref_type == 'tag'
    needs: [github-release]
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  ghcr:
    if: github.ref_type == 'tag'
    needs: [check, github-release]
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: linux
      - name: Push the image
        run: |
          docker load < image.tar.gz
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          repo="ghcr.io/${{ github.repository_owner }}/lobole-headless"
          repo="$(echo "$repo" | tr '[:upper:]' '[:lower:]')"   # GHCR is lowercase
          for tag in "${{ needs.check.outputs.version }}" latest; do
            docker tag lobole-headless:latest "$repo:$tag"
            docker push "$repo:$tag"
          done
