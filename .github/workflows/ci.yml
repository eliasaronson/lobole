# Build + the headless test suite: unit tests and headless_smoke run with no
# display server and no GPU (lobole --headless never initializes Vulkan).
# GUI-labeled ctest entries (gui_smoke, remote_smoke, mcp_smoke) stay
# local-only; the `gui-suite` job below runs the ImGui test-engine suite on
# SOFTWARE Vulkan instead, which needs no GPU.
# Deps mirror the README's apt list — CI doubles as its validation.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # For the sanitizers job below, which is run by hand and never on a schedule.
  workflow_dispatch:

jobs:
  # The GUI suite (./tools/gui-tests-xvfb.sh), on a runner with no GPU.
  #
  # It works because Mesa's lavapipe renders Vulkan on the CPU: verified
  # locally by forcing the same ICD, "Selected GPU: llvmpipe", 181/181. The
  # app is otherwise unchanged — same binary, same tests.
  #
  # SERIAL on purpose. A hosted runner has 2-4 vCPU and software rendering
  # burns the same cores the shards would compete for, while the test engine
  # kills any test that takes over 300 s. Locally, 2 shards on software
  # Vulkan took 141 s — but that box has 22 cores, so the timing does not
  # transfer even though the pass/fail does. Serial trades wall clock for not
  # having to guess.
  #
  # SHUFFLED because three order-dependent failures in one week were each
  # invisible until the shard partition moved, and each surfaced as an
  # unrelated test going red. The seed is printed; --shuffle <seed> replays a
  # failure exactly. See docs/ui/testing.md#independence-any-partition-is-valid.
  gui-suite:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # ffmpeg: capture/records_a_clip encodes a clip and decodes it back.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build build-essential ccache \
            libvulkan-dev glslc libglfw3-dev libglm-dev \
            libspdlog-dev libgtk-3-dev nlohmann-json3-dev \
            libeigen3-dev libboost-dev \
            libocct-data-exchange-dev libocct-modeling-algorithms-dev \
            libocct-modeling-data-dev libocct-foundation-dev \
            libocct-ocaf-dev libocct-visualization-dev libtbb-dev \
            libvterm-dev \
            xvfb mesa-vulkan-drivers ffmpeg

      # restore + save rather than actions/cache, because the save half must
      # run on FAILURE too. actions/cache only saves when the job succeeds, and
      # this suite has been red — so nothing was ever written under
      # `ccache-gui-*` and every run paid a ~15 min cold build ("Cache not
      # found for input keys" even on the restore-key prefix), which is exactly
      # the state where a warm cache is worth most. Saved straight after Build,
      # before the long test steps, since the compile cache is all it holds.
      - name: ccache (restore)
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ccache-gui-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-gui-${{ runner.os }}-

      # The lavapipe ICD's FILENAME is not stable across Mesa releases:
      # Ubuntu 24.04 shipped lvp_icd.x86_64.json and mesa 25.2 renamed it to
      # lvp_icd.json. Pinning the old path made the loader find no driver at
      # all, so vkCreateInstance returned VK_ERROR_INCOMPATIBLE_DRIVER (-9)
      # and the app aborted in SetupVulkan — a crash that reads like ours and
      # was not. Find it instead, and if it is missing say WHICH drivers are
      # installed rather than failing 15 minutes later in the suite.
      - name: Find the software Vulkan driver
        run: |
          icd=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json \
                   /usr/lib/*/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -1)
          if [ -z "$icd" ]; then
            echo "no lavapipe ICD found; installed drivers:"
            ls -l /usr/share/vulkan/icd.d/ /usr/lib/*/vulkan/icd.d/ 2>/dev/null
            exit 1
          fi
          echo "lavapipe ICD: $icd"
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: ccache (save)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ccache-gui-${{ runner.os }}-${{ github.sha }}

      # Not through tools/gui-tests-xvfb.sh: that script wraps everything in
      # nix-shell, which this runner does not have. Same binary and flags.
      - name: GUI suite (software Vulkan, serial, shuffled)
        run: |
          cd build
          xvfb-run -a -s "-screen 0 1280x720x24" \
            ./lobole --gui-tests --hidden --gui-test-shuffle \
            | tee gui.log
          # The app exits 0 whether or not a case failed, so the verdict comes
          # from its own summary line — the same trap tools/gui-tests-xvfb.sh
          # documents.
          line=$(grep -o 'GUI tests: [0-9]*/[0-9]* passed' gui.log | tail -1)
          echo "$line"
          # No "N/N passed" line means the suite failed, crashed, or never
          # ran — the failing summary reads "run ... SOME FAILED" instead, so
          # this branch covers all three and must not claim only the last.
          [ -n "$line" ] || {
            echo "no 'N/N passed' summary: the suite failed or did not run"
            tail -40 gui.log; exit 1; }
          ok=${line#GUI tests: }; ok=${ok%%/*}
          total=${line#*/}; total=${total%% passed}
          [ "$ok" = "$total" ] || exit 1

      # --offscreen: real renderer, no window, no display server — so no
      # xvfb-run here, deliberately: needing one would be the regression this
      # step exists to catch. Same lavapipe ICD as above; lavapipe emulates
      # ray query on the CPU, so even the render_still assertions run.
      # VK_DRIVER_FILES comes from the discovery step above, through
      # GITHUB_ENV — one answer for both steps.
      - name: Offscreen smoke (software Vulkan, NO Xvfb)
        run: ctest --test-dir build -R offscreen_smoke --output-on-failure

      # Pixel regression, and the one place it can be a real gate. lavapipe is
      # bit-reproducible for a fixed scene and camera (measured: three separate
      # processes, byte-identical PNGs), and the driver here is pinned by the
      # container image — so the baseline keyed to it always matches and exact
      # equality is usable instead of a tolerance nobody could justify.
      #
      # Run directly rather than through ctest, for --require-baseline: the
      # ctest registration SKIPS where no baseline matches the device, which is
      # right on a developer's GPU and wrong here. A Mesa bump changes the key
      # on purpose; this turns that into a red build so someone re-records
      # deliberately, instead of a gate that silently stopped applying.
      # The baseline is recorded in a container that matches this runner, not
      # on a developer GPU: `tools/ci-local.sh --pixel` checks it here and
      # `--pixel-record` writes it, both against ubuntu:24.04's llvmpipe. That
      # is also the answer to "why is a golden PNG in the tree portable at
      # all": measured on that image, the render is byte-identical across
      # runs AND with AVX2/FMA disabled (GALLIUM_OVERRIDE_CPU_CAPS=avx), so it
      # does not depend on the host CPU — only on the driver, which the key
      # names.
      - name: Pixel regression (software Vulkan, NO Xvfb)
        run: PYTHONPATH="$PWD/python" python3 tests/render_pixel_smoke.py build/lobole --require-baseline

      # A pixel diff nobody can look at is a failure nobody can act on: the
      # smoke writes the render it got beside the baseline, so hand it over.
      # Re-recording is then a download and a commit, whatever the cause.
      - name: The render it actually produced
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pixel-actual
          path: tests/golden/render/*.actual.png
          if-no-files-found: ignore

  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build build-essential ccache \
            libvulkan-dev glslc libglfw3-dev libglm-dev \
            libspdlog-dev libgtk-3-dev nlohmann-json3-dev \
            libeigen3-dev libboost-dev \
            libocct-data-exchange-dev libocct-modeling-algorithms-dev \
            libocct-modeling-data-dev libocct-foundation-dev \
            libocct-ocaf-dev libocct-visualization-dev libtbb-dev \
            libvterm-dev \
            python3-mypy python3-setuptools

      # See the gui-suite job: the save half runs on failure too, so a red
      # test step still leaves a warm compile cache behind.
      - name: ccache (restore)
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: ccache (save)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}

      # Ubuntu 24.04 ships OpenCASCADE 7.6.3 and the project is developed
      # against 7.9.3. Two cases differ: XCAF STEP import placement, and a
      # shell 7.6 refuses where 7.9 makes a no-op. (Two more were OURS, not
      # the kernel's — a float rotation OCC read as scaled; fixed in
      # CADShape::Transformed.) See the README's OpenCASCADE section.
      - name: Test (headless — everything without the gui label)
        # Parallel is safe: GPU-contending tests hold a shared RESOURCE_LOCK.
        run: |
          ctest --test-dir build -LE gui -j "$(nproc)" --output-on-failure \
            -E "Assembly import plan|Shell that removes no material"

      # The gate above SKIPS where the interpreter has no mypy, which is right
      # for a stock-Ubuntu container and wrong here: this is the job that
      # installs it. Running the script directly makes a dropped package a red
      # build rather than a gate that quietly stopped applying everywhere.
      - name: Typing gate (mypy is installed here, so it must not skip)
        run: PYTHONPATH="$PWD/python" python3 tests/inspection_typing_gate.py

      # The same for the wheel: setuptools is installed here for it.
      - name: Packaging smoke (setuptools is installed here, so it must not skip)
        run: python3 tests/packaging_smoke.py

      # Nothing pending on main: a branch's format bump is numbered by
      # tools/merge-branch.sh as it lands, and one cherry-picked without it
      # would ship its placeholder (docs/versioning/format.md#a-bump-takes-its-number-when-it-lands).
      - name: Format version landed
        if: github.ref == 'refs/heads/main'
        run: python3 tools/format-version.py check --landed

      # The build without Dear ImGui Test Engine — the configuration for
      # anyone who cannot take that dependency's license (it is free for
      # individuals, non-profits, open-source derivatives and companies under
      # 2M USD turnover; larger companies pay). A configuration nobody
      # compiles breaks silently, so CI compiles it on every push and proves
      # the app still models headlessly without it.
      - name: Build without the test engine
        run: |
          cmake -S . -B build-no-te -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DENABLE_TEST_ENGINE=OFF
          cmake --build build-no-te -j"$(nproc)"

      - name: Smoke the engine-free build
        run: |
          PYTHONPATH="$PWD/python" python3 tests/headless_smoke.py build-no-te/lobole
          ! build-no-te/lobole --gui-tests --hidden 2>/dev/null

      # The build without CAM, for exactly the reason stated above and with
      # the receipts to prove it: -DENABLE_CAM=OFF was accepted by CMake,
      # printed its own status line, and had not linked since CAM shipped on
      # 2026-08-21 -- 36 compile errors and nine undefined symbols, unnoticed
      # for two and a half weeks because nothing built it.
      #
      # The suite runs too, not just a smoke. The link was only half of what
      # was broken; headless_smoke called three CAM-only RPCs unguarded, which
      # no amount of compiling would have caught.
      - name: Build without CAM
        run: |
          cmake -S . -B build-nocam -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DENABLE_CAM=OFF
          cmake --build build-nocam -j"$(nproc)"

      - name: Test the CAM-free build
        run: |
          ctest --test-dir build-nocam -LE gui -j "$(nproc)" --output-on-failure \
            -E "Assembly import plan|Shell that removes no material"

  # The job above runs on GitHub's runner image, which carries hundreds of
  # preinstalled packages — so it cannot tell whether the README's apt list is
  # COMPLETE. A stock container can, and when this was first tried
  # (2026-08-17) the list was missing libtbb-dev and git, and the build failed
  # to link against Ubuntu's older OpenCASCADE. These jobs are the guard.
  #
  # 26.04 LTS ships OpenCASCADE 7.9.2 — parity with the kernel this project is
  # developed against, so it runs the WHOLE suite with no exclusions. 24.04
  # LTS ships 7.6.3 and is kept as a second, stricter oracle: it has already
  # caught three bugs that were ours rather than the kernel's.
  stock-ubuntu:
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:26.04
            exclude_tests: ""
          - image: ubuntu:24.04
            # XCAF STEP import placement, and a shell 7.6 refuses where 7.9
            # makes a no-op. See the README's OpenCASCADE section.
            exclude_tests: "Assembly import plan|Shell that removes no material"
    name: stock-ubuntu (${{ matrix.image }})
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    steps:
      # ca-certificates is a CONTAINER prerequisite, not a Designer one: a
      # bare ubuntu:24.04 has no CA roots, so actions/checkout cannot verify
      # github.com's certificate and the job dies before it starts. Listed
      # separately so this stays an honest test of the README's list.
      - name: Container prerequisites
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            --no-install-recommends ca-certificates

      - name: Install exactly what the README lists
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git cmake ninja-build build-essential python3 \
            libvulkan-dev glslc libglfw3-dev libglm-dev \
            libspdlog-dev libgtk-3-dev nlohmann-json3-dev libeigen3-dev libboost-dev \
            libocct-data-exchange-dev libocct-modeling-algorithms-dev \
            libocct-modeling-data-dev libocct-foundation-dev libocct-ocaf-dev \
            libocct-visualization-dev libtbb-dev libvterm-dev

      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"

      - name: Test
        run: |
          if [ -n "${{ matrix.exclude_tests }}" ]; then
            ctest --test-dir build -LE gui -j "$(nproc)" --output-on-failure \
              -E "${{ matrix.exclude_tests }}"
          else
            ctest --test-dir build -LE gui -j "$(nproc)" --output-on-failure
          fi

  # ASan + UBSan, by hand only — no push trigger and no schedule.
  #
  # The sanitizer flags miss the normal build's ccache entries, so this is a
  # cold compile of the whole project, and on runner hardware the suite then
  # takes ~98 minutes against ~6 locally on a warm tree. A weekly cron bought
  # none of that back: it ran unwatched and was red for three weeks before
  # anyone read it, which is worse than not running, because a red nightly
  # teaches you to ignore the badge.
  #
  # So the real gate is local — tools/ci-local.sh --asan, the same build and
  # the same exclusions — run when it is worth running: before a release,
  # after touching ownership or threading, or when chasing a crash. It found
  # a real use-after-free in August 2026 (46ca04b), which is the argument for
  # running it at all.
  #
  # The button here stays because this job is NOT redundant with the local
  # run: it builds against Ubuntu's apt OpenCASCADE, and nix's OCCT 7.9.3
  # does not leak the same way — the STEP controller suppression in
  # SanitizerDefaults.cpp exists for a leak that only this environment shows.
  sanitizers:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # Same list as build-and-test above (this runs on the runner image, not
      # a stock container, so it is not the README's completeness check).
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build build-essential ccache \
            libvulkan-dev glslc libglfw3-dev libglm-dev \
            libspdlog-dev libgtk-3-dev nlohmann-json3-dev \
            libeigen3-dev libboost-dev \
            libocct-data-exchange-dev libocct-modeling-algorithms-dev \
            libocct-modeling-data-dev libocct-foundation-dev \
            libocct-ocaf-dev libocct-visualization-dev libtbb-dev \
            libvterm-dev

      # A cache of its own: sanitized objects are not interchangeable with the
      # Release ones, and sharing a key would evict whichever ran last.
      # See the gui-suite job: the save half runs on failure too, so a red
      # test step still leaves a warm compile cache behind.
      - name: ccache (restore)
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ccache-asan-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-asan-${{ runner.os }}-

      - name: Build with sanitizers
        run: |
          cmake -S . -B build-asan -G Ninja -DENABLE_SANITIZERS=ON
          cmake --build build-asan -j"$(nproc)" --target designer designer_tests

      - name: ccache (save)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ccache-asan-${{ runner.os }}-${{ github.sha }}

      # The exclusions are two lists: the sanitizer's (long numeric gates and
      # the asan_slow label — see tools/sanitizer-env.sh) and this runner's OCC 7.6 pair, the same
      # two build-and-test skips.
      - name: Sanitized suite
        run: |
          source tools/sanitizer-env.sh
          ctest --test-dir build-asan -LE "$SANITIZER_LABEL_EXCLUDE" -j "$(nproc)" --output-on-failure \
            -E "$SANITIZER_TEST_EXCLUDE|Assembly import plan|Shell that removes no material"
