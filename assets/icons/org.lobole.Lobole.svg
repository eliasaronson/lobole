<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- The Loböle mark: "Lö" drawn in 2.4-wide strokes on a 24-unit grid.
       The stave's top is level with the dots' tops, the foot ends flush with
       the o's right edge, and the o stands 2.1 clear of both the stave and
       the foot. Tile = the viewport (#23262e), mark = the sketch line colour
       (#8cd9ff, kActiveSketchColor), rim keeps the tile's edge on a dark
       panel. -->
  <rect x="0.25" y="0.25" width="23.5" height="23.5" rx="4.8" fill="#23262e" stroke="#3d4250" stroke-width="0.5"/>
  <g fill="none" stroke="#8cd9ff" stroke-width="2.4" stroke-linecap="square">
    <path d="M6.5 5.1V18.9H17.5"/>
    <path d="M11 9.4H17.5V14.4H11Z"/>
  </g>
  <rect x="10.7" y="3.9" width="2.6" height="2.6" fill="#8cd9ff"/>
  <rect x="15.2" y="3.9" width="2.6" height="2.6" fill="#8cd9ff"/>
</svg>
